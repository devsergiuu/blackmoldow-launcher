name: Build Black Moldow iOS launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter 3.47.2 (engine a804b261)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Create iOS Runner and inject launcher source
        run: |
          flutter create --platforms ios --project-name blackmoldow_launcher app
          cp pubspec.yaml app/pubspec.yaml
          cp lib/main.dart app/lib/main.dart
          mkdir -p app/assets
          cp -R assets/* app/assets/
          cd app
          flutter pub get

      - name: Build AOT App.framework for iOS arm64
        run: |
          cd app
          flutter build ios --release --no-codesign

      - name: Assemble final IPA with the original client
        run: |
          set -e
          mkdir -p out
          cd out
          unzip -q ../base.ipa -d .
          APP=Payload/ReSALauncher.app/Frameworks/App.framework
          mkdir -p oldflutter
          cp -R "$APP/flutter_assets/." oldflutter/
          rm -rf "$APP"
          cp -R ../app/build/ios/iphoneos/Runner.app/Frameworks/App.framework "$APP"
          cp -Rn oldflutter/. "$APP/flutter_assets/"
          python3 - <<'PY'
          import json, os
          new = 'Payload/ReSALauncher.app/Frameworks/App.framework/flutter_assets/'
          old = 'oldflutter/'
          am = json.load(open(old + 'AssetManifest.json'))
          am.update(json.load(open(new + 'AssetManifest.json')))
          json.dump(am, open(new + 'AssetManifest.json', 'w'), ensure_ascii=False)
          fm = json.load(open(old + 'FontManifest.json'))
          families = {f.get('family') for f in fm}
          for f in json.load(open(new + 'FontManifest.json')):
              if f.get('family') not in families:
                  fm.append(f)
          json.dump(fm, open(new + 'FontManifest.json', 'w'), ensure_ascii=False)
          json.dump(json.load(open(old + 'NativeAssetsManifest.json')),
                    open(new + 'NativeAssetsManifest.json', 'w'), ensure_ascii=False)
          print('merged manifests')
          PY
          zip -qr ../blackmoldow-launcher.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blackmoldow-launcher-ipa
          path: blackmoldow-launcher.ipa
          if-no-files-found: error
